version: '3.8'

services:
  xiaozhi-backend:
    build: .
    container_name: xiaozhi-web-search-backend
    ports:
      - "8080:8080"
    environment:
      - BRAVE_API_KEY=${BRAVE_API_KEY}
      - TAVILY_API_KEY=${TAVILY_API_KEY}
      - BACKEND_HOST=0.0.0.0
      - BACKEND_PORT=8080
      - LOG_LEVEL=info
      - DEBUG=false
    volumes:
      - ./logs:/app/logs
    restart: unless-stopped
    networks:
      - xiaozhi-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

networks:
  xiaozhi-network:
    driver: bridge
